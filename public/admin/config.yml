# Decap CMS — the editor Tom uses at https://www.feelingmutual.com/admin
#
# Sign-in is handled by DecapBridge over PKCE, so Tom signs in with an email
# address and never needs a GitHub account. The site ID in the auth endpoints
# below is issued by the DecapBridge dashboard — see docs/CMS-SETUP.md.
#
# Publishing writes a markdown file straight into this repo on `master`.
# Netlify sees the commit and rebuilds. There is no server and no database:
# the CMS is a static page that talks to the GitHub API.

backend:
  name: git-gateway
  repo: SJDunkelman/feeling-mutual
  # DecapBridge's generated snippet says `main`. This repo's default branch is
  # `master`, and the mismatch fails at publish time rather than when /admin
  # loads, so it looks like a broken editor rather than a config typo.
  branch: master
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2c19ab3d-7b4e-4f95-973a-7076b6c31455/pkce
  auth_token_endpoint: /sites/2c19ab3d-7b4e-4f95-973a-7076b6c31455/token
  gateway_url: https://gateway.decapbridge.com
  # Attributes each commit to whoever made the change in the CMS, so the git
  # history stays readable once more than one person has access.
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Populates the editor's name and avatar from the PKCE login.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://www.feelingmutual.com
display_url: https://www.feelingmutual.com
# Feeling Mutual's own mark rather than the DecapBridge logo in the generated
# snippet — Tom should see something he recognises on the login screen.
logo_url: https://www.feelingmutual.com/images/full-logo-black.svg

# Publish straight to master. Decap's editorial workflow would stage drafts as
# GitHub pull requests, which puts Tom in front of a code review UI — exactly
# the kind of thing this setup exists to avoid.
publish_mode: simple

# Global fallback only. Both collections below override these so that images
# land in the same folder as the markdown file that references them, which is
# what Astro's image() helper needs to resolve them at build time.
media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Articles
    label_singular: Article
    description: >-
      Blog posts and articles. These show up at /blog and on the category pages.
    folder: src/content/blog
    create: true
    # One folder per post containing index.md plus its images. Astro resolves
    # showcaseImage relative to the markdown file, so co-locating is required —
    # a shared uploads folder would break the image() schema field.
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - label: Title
        name: title
        widget: string
        hint: The headline. Shown at the top of the article and in the blog list.

      - label: Date
        name: date
        widget: datetime
        # Written to the file as a plain date to match the existing posts.
        # picker_utc avoids the classic off-by-one-day timezone shift.
        format: 'YYYY-MM-DD'
        date_format: 'DD MMM YYYY'
        time_format: false
        picker_utc: true
        hint: The date shown under your name on the article.

      - label: Short summary
        name: description
        widget: text
        hint: >-
          One or two sentences. This is the preview text on the blog list page
          and the description Google shows in search results.

      - label: Main image
        name: showcaseImage
        widget: image
        # Required on purpose. Decap can write an empty string for an optional
        # image the editor opens and clears, and an empty string fails Astro's
        # image() schema check at build time — the site would stop building.
        required: true
        hint: >-
          The picture at the top of the article and on the blog list. Drag a
          file in or click to choose one. Any size is fine.

      - label: Section
        name: category
        widget: select
        default: article
        options:
          - { label: 'Article', value: 'article' }
          - { label: 'Case study', value: 'case-study' }
          - { label: 'Training', value: 'training' }
        hint: >-
          Which part of the site this belongs in. Leave as Article unless it is
          specifically a client case study or a training piece.

      - label: Tags
        name: tags
        widget: list
        required: false
        hint: Optional. Press Enter after each tag.

      - label: Article
        name: body
        widget: markdown
        # rich_text only. Leaving the markdown toggle available would expose
        # raw syntax, which is the thing the client explicitly does not want.
        modes: [rich_text]
        # Restricted to formatting the article stylesheet actually styles.
        # heading-one is omitted because the page title is already the h1.
        buttons:
          [
            bold,
            italic,
            heading-two,
            heading-three,
            quote,
            bulleted-list,
            numbered-list,
            link,
          ]
        editor_components: [image]
        hint: >-
          Write the article here. Use the toolbar for bold, headings and links,
          and the + button to drop an image into the middle of the text.

  - name: featured-case-studies
    label: Case Studies
    label_singular: Case Study
    description: >-
      Write-ups of client work. These appear on the blog page and under
      Case studies, at /category/case-study. The logo row on the home page is a
      fixed list of client marks and is not published from here.
    folder: src/content/featured-case-studies
    create: true
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - label: Client name
        name: title
        widget: string
        hint: The client, e.g. BBC. Also used for the web address.

      - label: Card title
        name: showcaseTitle
        widget: string
        hint: The heading shown on the case study card on the home page.

      - label: Short summary
        name: description
        widget: text
        hint: One or two sentences describing the project.

      - label: Client logo
        name: showcaseImage
        widget: image
        required: true
        hint: The client's logo, shown on the case study card on the blog page.

      - label: Type of work
        name: subCategory
        widget: string
        hint: >-
          A short label, e.g. "Customer Journey" or "Brand Strategy
          Development".

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD MMM YYYY'
        time_format: false
        picker_utc: true

      - label: Tags
        name: tags
        widget: list
        required: false
        hint: Optional. Press Enter after each tag.

      # The schema pins this to the literal 'case-study', so it is set for the
      # editor rather than shown as a one-option dropdown.
      - label: Section
        name: category
        widget: hidden
        default: 'case-study'

      - label: Write-up
        name: body
        widget: markdown
        modes: [rich_text]
        buttons:
          [
            bold,
            italic,
            heading-two,
            heading-three,
            quote,
            bulleted-list,
            numbered-list,
            link,
          ]
        editor_components: [image]
